<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fasting Timer</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fasting">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="view" id="view-timer">
      <section class="ring-area">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="ring-track" cx="100" cy="100" r="88"></circle>
            <circle class="ring-progress" id="ring-progress" cx="100" cy="100" r="88"></circle>
          </svg>
          <div class="ring-center" id="ring-center"></div>
        </div>
        <div class="readout">
          <div class="elapsed" id="elapsed">0h 00m</div>
          <div class="readout-label" id="readout-label">not fasting</div>
          <button class="link" id="start-time" type="button" disabled></button>
        </div>
      </section>

      <section class="controls">
        <div class="target" role="group" aria-label="Target duration">
          <button class="step" id="target-minus" type="button" aria-label="Decrease target by one hour">&minus;</button>
          <div class="target-value">
            <span class="target-number" id="target-hours">20</span>
            <span class="target-unit">hour target</span>
          </div>
          <button class="step" id="target-plus" type="button" aria-label="Increase target by one hour">+</button>
        </div>
        <button class="primary" id="start-stop" type="button">Start</button>
      </section>
    </div>

    <div class="view" id="view-log" hidden>
      <header class="log-header">
        <h1>Fast log</h1>
        <button class="export-btn" id="export-csv" type="button" disabled>Export CSV</button>
      </header>
      <div class="onedrive-row" id="onedrive-row" hidden>
        <div class="onedrive-text">
          <div id="onedrive-status"></div>
          <div class="onedrive-signin" id="onedrive-signin" hidden></div>
          <div class="onedrive-note" id="onedrive-note" hidden></div>
        </div>
        <div class="onedrive-actions">
          <button class="link-btn" id="onedrive-refresh" type="button" hidden>Refresh</button>
          <button class="link-btn" id="onedrive-action" type="button"></button>
        </div>
      </div>
      <p class="log-hint" id="log-hint" hidden><span id="log-count"></span> &middot; Tap a fast to edit or delete it.</p>
      <p class="log-empty" id="log-empty">No completed fasts yet. When you stop a fast it appears here.</p>
      <ul class="log-list" id="log-list"></ul>
    </div>

    <footer class="footer">
      <button class="footer-alert" id="onedrive-alert" type="button" hidden></button>
      <span class="build" id="build">build 13</span>
    </footer>

    <nav class="tabs" aria-label="Views">
      <button id="tab-timer" type="button" aria-selected="true">Timer</button>
      <button id="tab-log" type="button" aria-selected="false">Log</button>
    </nav>
  </main>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-body">
      <h2 id="sheet-title"></h2>
      <p class="sheet-error" id="sheet-error" role="alert" hidden></p>
      <div class="sheet-view" id="sheet-choice">
        <button class="sheet-btn main" id="sheet-now" type="button"></button>
        <button class="sheet-btn" id="sheet-earlier" type="button"></button>
        <button class="sheet-btn plain" id="sheet-cancel-choice" type="button">Cancel</button>
      </div>
      <div class="sheet-view" id="sheet-picker" hidden>
        <input type="datetime-local" id="sheet-input" aria-label="Date and time">
        <button class="sheet-btn main" id="sheet-confirm" type="button">Confirm</button>
        <button class="sheet-btn plain" id="sheet-cancel-picker" type="button">Cancel</button>
      </div>
      <div class="sheet-view" id="sheet-edit" hidden>
        <label class="field"><span>Start</span><input type="datetime-local" id="edit-start"></label>
        <label class="field"><span>End</span><input type="datetime-local" id="edit-end"></label>
        <button class="sheet-btn main" id="edit-save" type="button">Save</button>
        <button class="sheet-btn plain" id="edit-cancel" type="button">Cancel</button>
        <button class="sheet-btn danger" id="edit-delete" type="button">Delete this fast</button>
      </div>
      <div class="sheet-view" id="sheet-ask" hidden>
        <p class="sheet-message" id="ask-message"></p>
        <button class="sheet-btn main" id="ask-yes" type="button"></button>
        <button class="sheet-btn plain" id="ask-no" type="button"></button>
      </div>
    </div>
  </dialog>

  <script src="onedrive.js"></script>
  <script src="app.js"></script>
</body>
</html>
